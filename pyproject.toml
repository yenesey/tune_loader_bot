# Конфигурация инструментов. Это НЕ сборочный манифест: пакет `tune_loader_bot/`
# импортируется из корня репозитория, установка не требуется.

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 выключен: в коде есть длинные строки (SQL, регулярки).
# Строгие наборы ("UP", "B", "SIM", "RUF") можно включить отдельной задачей.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# чтобы работал и `pytest`, и `python -m pytest` (пакет tune_loader_bot)
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: требует доступа в сеть (по умолчанию не запускается)",
    "slow: длительный тест",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
