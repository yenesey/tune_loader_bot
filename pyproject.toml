# Конфигурация инструментов. Это НЕ сборочный манифест: проект пока плоский,
# установка пакета `tune_loader_bot/` появится в фазе 2-3 (см. REFACTORING_PLAN.md).

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 временно выключен: длинные строки (regex'ы, запросы) разъедутся по
# модулям в фазах 3-5, тогда правило включается.
# Строгие наборы ("UP", "B", "SIM", "RUF") — вместе с разбиением на модули.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# чтобы работал и `pytest`, и `python -m pytest` (пакет tune_loader_bot)
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: требует доступа в сеть (по умолчанию не запускается)",
    "slow: длительный тест",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
